# CI del repositorio (REL-A01, auditoría 2026-11-03, #331): antes de este
# workflow nada obligaba a correr las pruebas antes de publicar en main.
# Cubre: dominio (5 raíces), servicio contra PostgreSQL 17 real, unitarios
# de la landing y build de producción del front. La E2E con navegador queda
# fuera de CI (requiere Playwright + stack completo; se corre en revisión).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del servicio
        run: pip install -r servicio/requirements.txt

      - name: Dominio (las 5 raíces)
        run: |
          for raiz in core/incremento1 verticales/hotel/incremento1 verticales/cafeteria/incremento1 verticales/inmobiliaria/incremento1 verticales/constructora/incremento1; do
            echo "== $raiz =="
            (cd "$raiz" && PYTHONPATH="$PWD" python -m unittest discover -s tests -t .)
          done

      - name: Servicio (unittest contra PostgreSQL 17)
        env:
          DATABASE_URL_TEST: postgresql://plataforma:plataforma@127.0.0.1:5432/plataforma_test
        run: python -m unittest discover -s servicio/tests -t .

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Landing unitarios
        run: node --test 'landing/test/*.test.mjs'

      - name: Front build de producción
        working-directory: front
        env:
          API_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npm run build
