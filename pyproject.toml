# Fija el entrypoint que el preset FastAPI del build de Vercel debe servir
# cuando la raíz del build es el repo (formato `modulo:variable`, el que
# pide la plataforma). Sin esta clave (o sin api/index.py en la raíz) el
# build falla con FASTAPI_ENTRYPOINT_NOT_FOUND. La tabla [tool.vercel] no
# afecta a pip ni a Railway: sigue instalando desde requirements.txt de la
# raíz. Builds con raíz `servicio/` usan servicio/pyproject.toml.
[tool.vercel]
entrypoint = "api.index:app"
