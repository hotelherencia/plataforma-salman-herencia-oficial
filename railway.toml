# Configuración de despliegue para Railway (H7).
# El build usa Nixpacks (requirements.txt en la raíz); el arranque delega en
# el mismo entrypoint local: `python -m servicio` (uvicorn según Configuracion,
# host/puerto por variables SERVICIO_HOST/SERVICIO_PUERTO).

[build]
builder = "NIXPACKS"

[deploy]
# Titular real: el admin en BD es EMP-HERENCIA-001; sin estas banderas el
# núcleo queda EMP-SINTETICA-001 y GET /sesion invalida la cookie tras el login.
# W16-A02 (auditoría 2026-11-16): sin INVENTARIO_DOCUMENTAL=1 en el arranque.
# La carga documental es un comando puntual
# (`python scripts/aplicar_documental_desde_env.py`), nunca en cada reinicio.
startCommand = "EMPRESA_TITULAR=1 EMPRESA_ES_SINTETICA=0 EMPRESA_RUT=76.707.504-9 python -m servicio"
# OBS-02: el healthcheck del deploy consulta la base y las migraciones
# (/readiness); /salud sigue disponible como liveness pura.
healthcheckPath = "/readiness"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
