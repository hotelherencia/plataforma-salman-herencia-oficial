# Configuración de despliegue para Railway (H7).
# El build usa Nixpacks (requirements.txt en la raíz); el arranque delega en
# el mismo entrypoint local: `python -m servicio` (uvicorn según Configuracion,
# host/puerto por variables SERVICIO_HOST/SERVICIO_PUERTO).

[build]
builder = "NIXPACKS"

[deploy]
# Titular real: el admin en BD es EMP-HERENCIA-001; sin estas banderas el
# núcleo queda EMP-SINTETICA-001 y GET /sesion invalida la cookie tras el login.
startCommand = "EMPRESA_TITULAR=1 EMPRESA_ES_SINTETICA=0 EMPRESA_RUT=76.707.504-9 INVENTARIO_DOCUMENTAL=1 python -m servicio"
healthcheckPath = "/salud"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
